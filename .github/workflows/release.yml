name: build & release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      new_version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - id: check
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          try {
            $old = git show HEAD~1:OrbSpoofer/OrbSpoofer.csproj
            $oldVer = [regex]::Match($old, '<Version>(.*?)</Version>').Groups[1].Value
          } catch {
            "changed=false" | Out-File $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $newVer = [regex]::Match(
            (Get-Content OrbSpoofer/OrbSpoofer.csproj -Raw),
            '<Version>(.*?)</Version>'
          ).Groups[1].Value
          if ($oldVer -ne $newVer) {
            "changed=true"  | Out-File $env:GITHUB_OUTPUT -Append
            "version=$newVer" | Out-File $env:GITHUB_OUTPUT -Append
          } else {
            "changed=false" | Out-File $env:GITHUB_OUTPUT -Append
          }

      - run: dotnet build OrbSpoofer.slnx -c Release

      - run: dotnet test OrbSpoofer.slnx -c Release --no-build

  release:
    if: github.event_name == 'push' && needs.build.outputs.version_changed == 'true'
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - run: dotnet publish OrbSpoofer/OrbSpoofer.csproj -c Release -r win-x64 --self-contained true

      - name: Generate release body
        id: body
        shell: pwsh
        run: |
          $msg = git show -s --format=%B HEAD
          # Always strip the subject line (first line) to keep only the changelog body
          $lines = $msg -split "`n"
          $firstBlank = ($lines | Select-String -Pattern '^\s*$' | Select-Object -First 1).LineNumber
          if ($firstBlank) {
            $msg = ($lines[($firstBlank)..($lines.Length - 1)] -join "`n").Trim()
          } else {
            $msg = $msg.Trim()
          }
          # For merge commits with extra header, ensure we still get clean body
          # (already handled by stripping subject; no special case needed)
          # Append the running total across ALL releases (best-effort, never fails the release)
          try {
            $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/ZavalaSebas/OrbSpoofer/releases?per_page=100" -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN"; "User-Agent" = "OrbSpoofer-release" } -TimeoutSec 20
            $total = 0
            foreach ($r in $releases) { foreach ($a in $r.assets) { $total += [long]$a.download_count } }
            if ($total -gt 0) { $msg = "$msg`n`n---`n📥 **Total downloads (all versions):** $("{0:N0}" -f $total)" }
          } catch { Write-Host "Total downloads lookup failed: $($_.Exception.Message)" }
          $msg | Out-File -FilePath $env:RUNNER_TEMP/release_body.md -Encoding utf8NoBOM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.new_version }}
          body_path: ${{ runner.temp }}/release_body.md
          files: OrbSpoofer/bin/Release/net10.0-windows/win-x64/publish/OrbSpoofer.exe
